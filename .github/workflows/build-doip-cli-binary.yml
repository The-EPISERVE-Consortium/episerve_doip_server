name: Build DOIP CLI Binaries

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build CLI (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-latest]
        python-version: ["3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Create venv (Unix)
        if: runner.os != 'Windows'
        run: python -m venv venv
        shell: bash

      - name: Create venv (Windows)
        if: runner.os == 'Windows'
        run: python -m venv venv
        shell: pwsh

      # =========================
      # FILTER OUT MKDOCS FOR CLI
      # =========================
      - name: Filter CLI deps (Windows)
        if: runner.os == 'Windows'
        run: |
          (Get-Content requirements.txt) |
            Where-Object { $_ -notmatch "mkdocs" } |
            Set-Content requirements.txt
        shell: pwsh

      - name: Filter CLI deps (Unix)
        if: runner.os != 'Windows'
        run: |
          sed -i.bak '/mkdocs/d' requirements.txt
          rm requirements.txt.bak
        shell: bash

      # =========================
      # INSTALL
      # =========================
      - name: Install deps (Windows)
        if: runner.os == 'Windows'
        run: |
          venv\Scripts\Activate.ps1
          pip install --upgrade pip wheel setuptools
          pip install pyinstaller
          pip install -r requirements.txt
        shell: pwsh

      - name: Install deps (Unix)
        if: runner.os != 'Windows'
        run: |
          source venv/bin/activate
          pip install --upgrade pip wheel setuptools
          pip install pyinstaller
          pip install -r requirements.txt
        shell: bash

      # =========================
      # TESTS
      # =========================
      - name: Test (Windows)
        if: runner.os == 'Windows'
        run: |
          venv\Scripts\Activate.ps1
          pytest -vv
        shell: pwsh

      - name: Test (Unix)
        if: runner.os != 'Windows'
        run: |
          source venv/bin/activate
          pytest -vv
        shell: bash

      # =========================
      # BUILD
      # =========================
      - name: Build binary (Windows)
        if: runner.os == 'Windows'
        run: |
          venv\Scripts\Activate.ps1
          pyinstaller `
            --onefile client_cli\main.py `
            --name episerve-doip-cli `
            --console `
            --hidden-import=anyio `
            --hidden-import=sniffio `
            --hidden-import=h11 `
            --clean `
            --log-level=WARN
          certutil -hashfile dist\episerve-doip-cli.exe SHA256 > dist\checksum.txt
        shell: pwsh

      # Build inside an older glibc container so the binary runs on Ubuntu 20.04+
      - name: Build binary (Linux)
        if: runner.os == 'Linux'
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            python:3.12-slim-bullseye \
            bash -c "
              apt-get update -qq && apt-get install -y -q binutils &&
              pip install --upgrade pip wheel setuptools pyinstaller -r requirements.txt &&
              pyinstaller \
                --onefile client_cli/main.py \
                --name episerve-doip-cli \
                --console \
                --hidden-import=anyio \
                --hidden-import=sniffio \
                --hidden-import=h11 \
                --clean \
                --log-level=WARN
            "
          sha256sum dist/episerve-doip-cli > dist/checksum.txt
        shell: bash

      - name: Build binary (macOS)
        if: runner.os == 'macOS'
        run: |
          source venv/bin/activate
          pyinstaller \
            --onefile client_cli/main.py \
            --name episerve-doip-cli \
            --console \
            --hidden-import=anyio \
            --hidden-import=sniffio \
            --hidden-import=h11 \
            --clean \
            --log-level=WARN
          sha256sum dist/episerve-doip-cli > dist/checksum.txt
        shell: bash

      # =========================
      # ARTIFACTS
      # =========================
      - name: Upload CLI binary artifacts
        uses: actions/upload-artifact@v4
        with:
          name: episerve-doip-cli-${{ matrix.os }}
          path: |
            dist/episerve-doip-cli*
            dist/checksum.txt
          if-no-files-found: error
          overwrite: true

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Rename binaries for release
        run: |
          cp artifacts/episerve-doip-cli-ubuntu-22.04/episerve-doip-cli       episerve-doip-cli-linux
          cp artifacts/episerve-doip-cli-macos-latest/episerve-doip-cli        episerve-doip-cli-macos
          cp artifacts/episerve-doip-cli-windows-latest/episerve-doip-cli.exe  episerve-doip-cli-windows.exe

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create ${{ github.ref_name }} \
            episerve-doip-cli-linux \
            episerve-doip-cli-macos \
            episerve-doip-cli-windows.exe \
            --repo ${{ github.repository }} \
            --generate-notes
